# Checks every manifest against the schema. Runs on GitHub-hosted runners: this repository is
# public, and pull requests from forks must never reach the organisation's self-hosted machines.
name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate
        run: |
          python3 -m pip install --quiet "jsonschema>=4"
          python3 - <<'PY'
          import glob, json, sys
          from jsonschema import Draft202012Validator
          schema = json.load(open("schema/update-manifest.schema.json"))
          validator = Draft202012Validator(schema)
          bad = 0
          for path in sorted(glob.glob("*/latest.json") + glob.glob("*/beta.json")):
              for err in validator.iter_errors(json.load(open(path))):
                  print(f"::error file={path}::{err.message}")
                  bad += 1
              print(f"checked {path}")
          sys.exit(1 if bad else 0)
          PY
